# Publishes NISM-RA-Study-Kit/ to GitHub Pages on every push to main.
# The build scripts and the handover notes stay in the repo but are not served.
name: Deploy study kit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy site files
        run: rsync -a --exclude '_build' --exclude 'HANDOVER.md' NISM-RA-Study-Kit/ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
